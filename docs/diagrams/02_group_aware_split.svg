<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Group-aware splitting</title><desc id="d">Near-duplicate images are clustered into groups with a hash prefilter, a pixel-correlation check and union-find; whole groups are assigned to the locked test set or to one of five CV folds.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8895A7"/></marker></defs><rect width="1000" height="470" rx="14" fill="#FFFFFF"/>
<text x="500" y="34" font-size="19" font-weight="700" fill="#1F2933" text-anchor="middle" >Why and how the split is group-aware</text>
<text x="500" y="58" font-size="13" font-weight="400" fill="#52606D" text-anchor="middle" >No patient IDs exist, so near-duplicate clusters are used as a proxy for 'same patient / same scan'</text>
<rect x="30" y="80" width="215" height="84" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="137.5" y="109.0" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle" >1. dHash prefilter</text>
<text x="137.5" y="127.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >9x8 grey difference hash;</text>
<text x="137.5" y="145.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >candidate if Hamming &lt;= 8</text>
<rect x="270" y="80" width="215" height="84" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="377.5" y="109.0" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle" >2. Confirm</text>
<text x="377.5" y="127.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >64x64 z-scored pixels;</text>
<text x="377.5" y="145.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >keep pair if corr >= 0.90</text>
<rect x="510" y="80" width="215" height="84" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="617.5" y="109.0" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle" >3. Union-find</text>
<text x="617.5" y="127.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >connected pairs merge</text>
<text x="617.5" y="145.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >into one group id</text>
<rect x="750" y="80" width="215" height="84" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="857.5" y="109.0" font-size="15" font-weight="600" fill="#1F2933" text-anchor="middle" >4. Assign sets</text>
<text x="857.5" y="127.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >groups >= 10 images go to dev;</text>
<text x="857.5" y="145.0" font-size="12.5" font-weight="400" fill="#52606D" text-anchor="middle" >StratifiedGroupKFold by class</text>
<polyline points="245,122 268,122" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="485,122 508,122" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="725,122 748,122" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="30" y="214" font-size="13" font-weight="600" fill="#1F2933" text-anchor="start" >Result: whole groups are assigned to one set</text>
<rect x="30" y="230" width="190" height="150" rx="10" fill="#F6DCE3" stroke="#B5415D" stroke-width="1.6"/>
<text x="125" y="252" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle" >Locked test</text>
<text x="125" y="270" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >320 images, scored once</text>
<rect x="250" y="230" width="136" height="150" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="318" y="252" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle" >Fold 0</text>
<text x="318" y="270" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >validation fold</text>
<rect x="396" y="230" width="136" height="150" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="464" y="252" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle" >Fold 1</text>
<text x="464" y="270" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >validation fold</text>
<rect x="542" y="230" width="136" height="150" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="610" y="252" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle" >Fold 2</text>
<text x="610" y="270" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >validation fold</text>
<rect x="688" y="230" width="136" height="150" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="756" y="252" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle" >Fold 3</text>
<text x="756" y="270" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >validation fold</text>
<rect x="834" y="230" width="136" height="150" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="902" y="252" font-size="14" font-weight="700" fill="#1F2933" text-anchor="middle" >Fold 4</text>
<text x="902" y="270" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >validation fold</text>
<text x="615" y="402" font-size="13" font-weight="400" fill="#52606D" text-anchor="middle" >Development set: 2096 images, 5 folds (train on 4, validate on 1)</text>
