<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">SVM pipeline on hand-crafted features</title><desc id="d">A grayscale letterboxed image yields HOG, uniform LBP, GLCM and intensity-histogram features that are concatenated, standardised and classified by an RBF SVM.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8895A7"/></marker></defs><rect width="1100" height="500" rx="14" fill="#FFFFFF"/>
<text x="550" y="34" font-size="19" font-weight="700" fill="#1F2933" text-anchor="middle" >SVM baseline: hand-crafted features + RBF kernel</text>
<rect x="24" y="150" width="150" height="110" rx="10" fill="#EEF2F6" stroke="#8895A7" stroke-width="1.6"/>
<text x="99.0" y="183.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >Image</text>
<text x="99.0" y="201.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >letterbox 224x224</text>
<text x="99.0" y="219.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >convert to 8-bit</text>
<text x="99.0" y="237.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >grayscale</text>
<rect x="235" y="62" width="300" height="68" rx="10" fill="#E6E6E6" stroke="#6B6B6B" stroke-width="1.6"/>
<text x="385.0" y="83.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >HOG (1296 values)</text>
<text x="385.0" y="101.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >9 orientations, 32x32 cells, 2x2 blocks</text>
<text x="385.0" y="119.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >shape / edge structure</text>
<polyline points="174,205 205,205 205,96 233,96" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="535,96 580,96" fill="none" stroke="#8895A7" stroke-width="1.8"/>
<rect x="235" y="144" width="300" height="68" rx="10" fill="#E6E6E6" stroke="#6B6B6B" stroke-width="1.6"/>
<text x="385.0" y="165.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >LBP (10 values)</text>
<text x="385.0" y="183.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >uniform, P=8, R=1 histogram</text>
<text x="385.0" y="201.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >micro-texture</text>
<polyline points="174,205 205,205 205,178 233,178" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="535,178 580,178" fill="none" stroke="#8895A7" stroke-width="1.8"/>
<rect x="235" y="226" width="300" height="68" rx="10" fill="#E6E6E6" stroke="#6B6B6B" stroke-width="1.6"/>
<text x="385.0" y="247.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >GLCM (12 values)</text>
<text x="385.0" y="265.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >6 statistics x 2 distances, angle-averaged</text>
<text x="385.0" y="283.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >second-order texture</text>
<polyline points="174,205 205,205 205,260 233,260" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="535,260 580,260" fill="none" stroke="#8895A7" stroke-width="1.8"/>
<rect x="235" y="308" width="300" height="68" rx="10" fill="#E6E6E6" stroke="#6B6B6B" stroke-width="1.6"/>
<text x="385.0" y="329.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >Grey histogram (32 values)</text>
<text x="385.0" y="347.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >32 bins, normalised</text>
<text x="385.0" y="365.0" font-size="11.5" font-weight="400" fill="#52606D" text-anchor="middle" >overall intensity</text>
<polyline points="174,205 205,205 205,342 233,342" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="535,342 580,342" fill="none" stroke="#8895A7" stroke-width="1.8"/>
<polyline points="580,96 580,342" fill="none" stroke="#8895A7" stroke-width="1.8"/>
<polyline points="580,219 616,219" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="618" y="160" width="150" height="118" rx="10" fill="#E6E6E6" stroke="#6B6B6B" stroke-width="1.6"/>
<text x="693.0" y="188.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >Concatenate</text>
<text x="693.0" y="206.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >feature vector</text>
<text x="693.0" y="224.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >about 1.35k dims</text>
<text x="693.0" y="242.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >(1352 in the</text>
<text x="693.0" y="260.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >original run)</text>
<polyline points="768,219 800,219" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="802" y="160" width="140" height="118" rx="10" fill="#E6E6E6" stroke="#6B6B6B" stroke-width="1.6"/>
<text x="872.0" y="197.0" font-size="13.5" font-weight="600" fill="#1F2933" text-anchor="middle" >StandardScaler</text>
<text x="872.0" y="215.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >zero mean,</text>
<text x="872.0" y="233.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >unit variance</text>
<text x="872.0" y="251.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >(fit on train)</text>
<polyline points="872,278 872,396" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="560" y="398" width="300" height="62" rx="10" fill="#E6E6E6" stroke="#6B6B6B" stroke-width="1.6"/>
<text x="710.0" y="425.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >RBF SVC: C = 30, gamma = 0.001</text>
<text x="710.0" y="443.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >no class weights; one model, all dev data</text>
<rect x="930" y="404" width="140" height="50" rx="10" fill="#E3F1E7" stroke="#3C8D5A" stroke-width="1.6"/>
<text x="1000.0" y="425.0" font-size="14" font-weight="600" fill="#1F2933" text-anchor="middle" >Class label</text>
<text x="1000.0" y="443.0" font-size="12" font-weight="400" fill="#52606D" text-anchor="middle" >one of 5</text>
<polyline points="860,429 928,429" fill="none" stroke="#8895A7" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
